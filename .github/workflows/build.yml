name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install librsvg (for icon generation)
        run: brew install librsvg

      - name: Build .app bundle
        run: bash build.sh

      - name: Ad-hoc code sign
        run: codesign --force --deep --sign - dist/ClaudeMonitor.app

      - name: Package app
        run: ditto -c -k --keepParent dist/ClaudeMonitor.app dist/ClaudeMonitor.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeMonitor
          path: dist/ClaudeMonitor.zip
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ClaudeMonitor.zip
          generate_release_notes: true
